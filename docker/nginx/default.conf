server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Bundles JS/CSS dos MFEs (~12 MB sem compressão) e respostas da API em JSON. O nginx só
    # comprime respostas >= gzip_min_length; imagens/fontes já vêm comprimidas e ficam de fora.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    # Docker's embedded DNS (127.0.0.11). A plain `proxy_pass http://gateway-service:8080`
    # resolves the hostname once at config load and keeps that IP for the worker's lifetime —
    # if gateway-service is later recreated (redeploy, restart, `make up-gateway`) it gets a new
    # IP and nginx keeps proxying to the stale one until reloaded/restarted. Routing proxy_pass
    # through a variable forces re-resolution per the resolver's TTL instead.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway http://gateway-service:8080;
        proxy_pass $gateway;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location /mfe/config/ {
        alias /usr/share/nginx/html/config/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/auth/ {
        alias /usr/share/nginx/html/auth/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/stock/ {
        alias /usr/share/nginx/html/stock/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/sales/ {
        alias /usr/share/nginx/html/sales/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/purchasing/ {
        alias /usr/share/nginx/html/purchasing/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/cashflow/ {
        alias /usr/share/nginx/html/cashflow/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/invoicing/ {
        alias /usr/share/nginx/html/invoicing/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/bi/ {
        alias /usr/share/nginx/html/bi/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /mfe/reports/ {
        alias /usr/share/nginx/html/reports/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /usr/share/nginx/html/shell;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
}
